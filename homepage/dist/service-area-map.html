<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Beautiful Blinds &amp; Shades service area</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;color:#20282e}
    #map{width:100%;height:100%;background:#eef2eb}
    .map-label{position:absolute;top:14px;left:14px;z-index:500;background:white;border:1px solid #dde3df;border-radius:9px;padding:12px 15px;box-shadow:0 3px 15px #18283215;pointer-events:none;font-size:13px;line-height:1.5}
    .map-label strong{display:block;font-size:14px;font-weight:600}
    .map-label span:before{content:'';display:inline-block;width:22px;height:3px;background:#67b2e8;border-radius:2px;vertical-align:middle;margin-right:7px}
    .leaflet-container{font-family:Arial,Helvetica,sans-serif}
    .leaflet-bar{border:1px solid #d8e0e3!important;box-shadow:0 3px 12px #0001;border-radius:7px;overflow:hidden}
    .leaflet-control-attribution{font-size:10px!important}
    .map-reset{border:0;background:white;color:#204762;padding:10px 13px;min-height:42px;cursor:pointer;font:600 12px Arial,sans-serif}
    .map-reset:hover{background:#eaf4fb}
    .map-reset:focus-visible{outline:3px solid #235d83;outline-offset:-3px}
    .map-fallback{position:absolute;top:40%;left:8%;right:8%;z-index:600;padding:24px;text-align:center;background:white;border-radius:10px;font-size:15px;line-height:1.7}
    .map-fallback a{color:#235d83}
    [hidden]{display:none!important}
  </style>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
  <script src="service-area-map.js" defer></script>
</head>
<body>
  <div id="map" role="region" aria-label="Interactive service-area map. The blue boundary runs from Warsaw and Angola south to Bluffton, with Fort Wayne inside. Use the zoom buttons to explore."></div>
  <div class="map-label"><strong>Beautiful Blinds &amp; Shades</strong><span>Our service area</span></div>
  <div id="map-fallback" class="map-fallback">Serving Fort Wayne and Northeast Indiana.<br><a href="https://www.google.com/maps?cid=11383874825751228298" target="_blank" rel="noopener">View our business on Google Maps</a></div>
</body>
</html>
