# The site is the committed static output in homepage/dist. `npm run build` runs
# the tests (a failing test stops the deploy), then copies homepage/dist to _site
# with every .css and .js file minified (scripts/minify-site.mjs). Netlify
# publishes _site; file names and ?v= URLs are unchanged.
[build]
  base = "."
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# /api/consultation adds consultation requests to Beautiful Blinds & Shades'
# GoHighLevel, tagged "website lead". It needs the GHL_PRIVATE_TOKEN and
# GHL_LOCATION_ID environment variables (Netlify, never committed).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# netlify/edge-functions/search-block.js noindexes every host except
# www.beautifulblindsandshades.com (netlify.app, deploy previews, branch deploys).
